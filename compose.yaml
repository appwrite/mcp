services:
  appwrite-mcp:
    build:
      context: .
    image: appwrite-mcp:local
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      MCP_TRANSPORT: http
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-https://cloud.appwrite.io/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-console}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCS_SEARCH_MIN_SCORE: ${DOCS_SEARCH_MIN_SCORE:-0.25}
      DOCS_SEARCH_LIMIT: ${DOCS_SEARCH_LIMIT:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      MCP_EVENTS: ${MCP_EVENTS:-}
      MCP_EVENTS_PUSH: ${MCP_EVENTS_PUSH:-}
      MCP_EVENTS_SEALING_KEYS: ${MCP_EVENTS_SEALING_KEYS:-}
      MCP_EVENTS_REDIS_URL: redis://dragonfly:6379/0
    depends_on:
      dragonfly:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Carries push events between replicas (MCP_EVENTS_PUSH), as in the cluster;
  # any Redis-protocol server works. See docs/events.md.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    command: ["dragonfly", "--logtostderr", "--dbfilename=", "--proactor_threads=2"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
